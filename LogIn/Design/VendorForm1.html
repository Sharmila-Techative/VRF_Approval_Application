<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background: #f5f5f5;
            margin: 0;
            padding: 2px;
            font-size: 10.5px;
            line-height: 1.1;
        }

        /* ✅ MINIMAL PAGE SPLIT FIX - NO DESIGN CHANGE */
        @page {
            size: A4;
            margin: 1cm;
        }

        .field-line {
            page-break-inside: avoid;
        }

        .inline-fields {
            page-break-inside: avoid;
        }

        /* ✅ FORCE CLEAN BREAK BEFORE ITEMS - No design change */
        div.section-title:nth-of-type(6) { /* "19. Items Supplied" */
            page-break-before: always;
        }

        /* ✅ Ensure content flows properly */
        .readonly-field {
            max-height: none;
            overflow: visible;
        }


        .page {
            width: 1094px;
            min-height: 1123px;
            background: #fff;
            border: 1px solid #000;
            /*            padding: 15px 28px 130px 28px;*/
            padding: 5px 18px 120px 18px;
            margin: 0 auto;
            position: relative;
            box-sizing: border-box;
            page-break-after: auto;
            z-index: 1;
            overflow: hidden;
        }

        /*.page {
                    width: 794px;
                    min-height: 1123px;
                    background: #fff;
                    border: 1px solid #000;
                    padding: 15px 28px 40px 28px;*/ /* was 130px bottom, reduce to 40px */
        /*margin: 0 auto;
                    position: relative;

                    page-break-after: auto;
                    z-index: 1;
                    overflow: visible;*/ /* was hidden */
        /*}*/

        /* Logo box EXACT PDF size & 1px border */
        .logo-box {
            margin-top: 0px;
            border: 2px solid #000;
            width: 745px;
            height: 95px;
            margin: 0 auto 8px;
            padding: 6px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .logo {
            width: 425px;
            height: auto;
            max-height: 75px;
            display: block;
        }

        .header {
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            margin: 0 0 10px 0;
            line-height: 1.1;
            /* SINGLE LINE like PDF */
            white-space: nowrap;
        }

        h2 {
            text-align: center;
            text-decoration: underline;
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: bold;
        }

        /* First 4 fields - EXACT PDF positioning */
        .ref-table {
            width: 100%;
            margin-bottom: 15px;
            font-size: 10.5px;
            table-layout: fixed;
        }

            .ref-table td {
                width: 50%;
                padding: 0;
                vertical-align: top;
            }

                .ref-table td:first-child {
                    padding-right: 15px;
                }

            .ref-table .field-line {
                margin: 6px 0;
                padding: 2px 0;
            }

        .field-line {
            margin: 15px 0;
            font-size: 10.5px;
            display: flex;
            align-items: center;
        }

            .field-line label {
                font-weight: bold;
                width: 155px;
                flex-shrink: 0;
                margin-right: 10px;
            }

        .readonly-field {
            border-bottom: 1px solid #000;
            flex: 1;
            padding: 2px 4px;
            min-height: 15px;
            font-size: 10.5px;
            max-width: 330px;
        }

        /* Same line fields */
        .inline-fields {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

            .inline-fields .field-group {
                width: 48%;
                display: flex;
                align-items: center;
            }

            .inline-fields label {
                width: 80px;
                margin-right: 8px;
            }

            .inline-fields .readonly-field {
                width: 185px;
            }

        /* Remarks single box */
        .remarks-section {
            border: 1px solid #000;
            padding: 18px;
            margin: 25px 0 135px 0;
            width: 100%;
            box-sizing: border-box;
        }

        .remarks-label {
            font-weight: bold;
            font-size: 10.5px;
            margin-bottom: 2px;
            display: block;
        }

        .remarks-field {
            /*border-bottom: 1px solid #000;*/
            min-height: 40px;
            padding: 5px;
            width: 100%;
            font-size: 10.5px;
            box-sizing: border-box;
        }

        /* Section titles */
        .section-title {
            font-weight: bold;
            padding: 5px 9px;
            margin: 20px 0 12px;
            font-size: 11.5px;
            background: #f8f8f8;
            border-bottom: 1px solid #ccc;
        }

        /* Items section */
        /*.items-section {
            margin: 12px 0 20px 0;
            font-size: 10.5px;

        }

            .items-section strong {
                font-weight: bold;

*/

        .items-section {
            margin: 12px 0 20px 0;
            font-size: 10.5px;
            line-height: 1.25;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* each item box */
        .item-box {
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        /* LARGE centered stamp box */
        /*        .stamp-box {
                    position: absolute;

                    border: 2px solid #000;
                    text-align: center;
                    padding: 16px;
                    box-sizing: border-box;
                    background: #fff;

        .stamp-box {
            width: 535px;
            height: 105px;
            border: 2px solid #000;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
            background: #fff;
            margin: 3px auto 0 auto; /* adds spacing above */
            page-break-inside: avoid; /* keeps it intact */

        .signature-text {

            font-weight: bold;
            font-size: 10.5px;
        }

        .page .watermark {

            width: 90%;
            text-align: center;

            letter-spacing: 10px;

            pointer-events: none;
            user-select: none;
            z-index: 0;
            white-space: nowrap;
        }


        .readonly-field {
            display: inline-block;
            text-align: left;
            width: 150px; /* optional, adjust as needed */
        }

        .field-line {
            display: flex;
            justify-content: flex-start;
            align-items: center;

            .field-line label {

                text-align: left;
            }


        .page * {

            z-index: 1;
        }

        label {

        }

        .markdown-table {

    </style>
</head>

    <script>
        var watermarkText = sessionStorage.getItem('WatermarkText') || "DRAFT";
        document.getElementById('watermark').innerText = watermarkText;

        var formData = JSON.parse(sessionStorage.getItem('PreviewData') || "{}");
        for (var key in formData) {
            if (document.getElementById(key)) {
                document.getElementById(key).innerText = formData[key];
            }
        }

        var goods = formData["Major goods and services Details With"] || [];
        var itemsSection = document.getElementById('items_supplied');
        var letters = 'abcdefghijklmnopqrstuvwxyz'.split('');

        for (var i = 0; i < goods.length; i++) {
            itemsSection.innerHTML += `<div style="margin-bottom: 7px;"><strong>${letters[i]}) Product:</strong> ${goods[i]?.Product || ''}<br>
                                                                                                                                                      <strong>Brand:</strong> ${goods[i]?.Brand || ''}<br>
                                                                                                                                                      <strong>Size:</strong> ${goods[i]?.Size || ''}</div>`;
        }
    </script>
    <script>
        const date = new Date(); // or your date value
        const formattedDate =
            String(date.getDate()).padStart(2, '0') + '/' +
            String(date.getMonth() + 1).padStart(2, '0') + '/' +
            date.getFullYear();

        document.getElementById('form_date').textContent = formattedDate;
        document.getElementById('msme_date').textContent = formattedDate;
